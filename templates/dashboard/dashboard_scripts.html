<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const chartDefaults = {
        borderColor: '#0f172a',
        backgroundColor: 'rgba(59, 130, 246, 0.2)'
    };

    const initializeCharts = () => {
        if (typeof Chart === 'undefined') {
            return;
        }

        const charts = [
            {
                id: 'fuelEfficiencyChart',
                type: 'line',
                data: [3.1, 3.3, 3.2, 3.5, 3.4, 3.6, 3.5],
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6', 'Week 7']
            },
            {
                id: 'tireCostChart',
                type: 'bar',
                data: [11.2, 12.8, 10.9, 13.4, 12.1],
                labels: ['RJ14 2201', 'RJ14 2209', 'RJ14 2215', 'RJ14 2233', 'RJ14 2240']
            },
            {
                id: 'operationsSummaryChart',
                type: 'doughnut',
                data: [248, 144],
                labels: ['Coal', 'Mining'],
                backgroundColor: ['#f59e0b', '#2563eb']
            }
        ];

        charts.forEach((config) => {
            const canvas = document.getElementById(config.id);
            if (!canvas) {
                return;
            }

            if (canvas.dataset.chartInitialized) {
                return;
            }

            canvas.dataset.chartInitialized = 'true';
            const ctx = canvas.getContext('2d');
            new Chart(ctx, {
                type: config.type,
                data: {
                    labels: config.labels,
                    datasets: [
                        {
                            label: canvas.dataset.chartLabel || 'Metric',
                            data: config.data,
                            borderWidth: 2,
                            borderColor: chartDefaults.borderColor,
                            backgroundColor: config.backgroundColor || chartDefaults.backgroundColor,
                            fill: config.type === 'line'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: config.type === 'doughnut'
                        }
                    }
                }
            });
        });
    };

    const setupActivityRefresh = () => {
        const activityFeed = document.getElementById('activity-feed');
        if (!activityFeed) {
            return;
        }

        const refreshInterval = activityFeed.dataset.refreshInterval || 60000;
        setInterval(() => {
            if (typeof htmx !== 'undefined') {
                htmx.trigger(activityFeed, 'refresh');
            }
        }, refreshInterval);
    };

    const setupMobileToggle = () => {
        document.querySelectorAll('[data-mobile-toggle]').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const target = document.querySelector(toggle.dataset.mobileToggle);
                if (target) {
                    target.classList.toggle('hidden');
                }
            });
        });
    };

    const setupFormValidation = () => {
        document.querySelectorAll('form[data-validate]').forEach((form) => {
            form.addEventListener('submit', (event) => {
                const requiredFields = form.querySelectorAll('[required]');
                let isValid = true;

                requiredFields.forEach((field) => {
                    if (!field.value.trim()) {
                        field.classList.add('border-rose-500');
                        isValid = false;
                    } else {
                        field.classList.remove('border-rose-500');
                    }
                });

                if (!isValid) {
                    event.preventDefault();
                }
            });
        });
    };

    document.addEventListener('htmx:afterRequest', (event) => {
        if (event.target && event.target.hasAttribute('data-dismiss-alert') && event.detail.successful) {
            const alertCard = event.target.closest('[data-alert-card]') || event.target.closest('div');
            if (alertCard) {
                alertCard.remove();
            }
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        initializeCharts();
        setupActivityRefresh();
        setupMobileToggle();
        setupFormValidation();
    });
</script>
