<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const chartInstances = {};
    const chartTheme = {
        fuel: {
            borderColor: '#0f172a',
            backgroundColor: 'rgba(59, 130, 246, 0.2)'
        },
        tire: {
            borderColor: '#7c3aed',
            backgroundColor: 'rgba(124, 58, 237, 0.3)'
        },
        operations: ['#f59e0b', '#2563eb']
    };

    const formatDateInputValue = (date) => date.toLocaleDateString('en-CA');

    const normalizeChartSeries = (labels, data) => {
        if (!labels.length) {
            return { labels: ['No data'], data: [0] };
        }
        return { labels, data };
    };

    const initializeCharts = () => {
        if (typeof Chart === 'undefined') {
            return;
        }

        const fuelCanvas = document.getElementById('fuelEfficiencyChart');
        if (fuelCanvas && !chartInstances.fuelEfficiency) {
            chartInstances.fuelEfficiency = new Chart(fuelCanvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: fuelCanvas.dataset.chartLabel || 'Fuel Efficiency',
                            data: [],
                            borderWidth: 2,
                            borderColor: chartTheme.fuel.borderColor,
                            backgroundColor: chartTheme.fuel.backgroundColor,
                            fill: true,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        const tireCanvas = document.getElementById('tireCostChart');
        if (tireCanvas && !chartInstances.tireCost) {
            chartInstances.tireCost = new Chart(tireCanvas.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: tireCanvas.dataset.chartLabel || 'Tire Cost',
                            data: [],
                            borderWidth: 1,
                            borderColor: chartTheme.tire.borderColor,
                            backgroundColor: chartTheme.tire.backgroundColor
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        const operationsCanvas = document.getElementById('operationsSummaryChart');
        if (operationsCanvas && !chartInstances.operationsSummary) {
            chartInstances.operationsSummary = new Chart(operationsCanvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: operationsCanvas.dataset.chartLabel || 'Operations',
                            data: [],
                            backgroundColor: chartTheme.operations
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true
                        }
                    }
                }
            });
        }
    };

    const updateCharts = (payload) => {
        if (!payload) {
            return;
        }

        if (chartInstances.fuelEfficiency && payload.fuel_efficiency) {
            const normalized = normalizeChartSeries(payload.fuel_efficiency.labels || [], payload.fuel_efficiency.data || []);
            chartInstances.fuelEfficiency.data.labels = normalized.labels;
            chartInstances.fuelEfficiency.data.datasets[0].data = normalized.data;
            chartInstances.fuelEfficiency.update();
        }

        if (chartInstances.tireCost && payload.tire_costs) {
            const normalized = normalizeChartSeries(payload.tire_costs.labels || [], payload.tire_costs.data || []);
            chartInstances.tireCost.data.labels = normalized.labels;
            chartInstances.tireCost.data.datasets[0].data = normalized.data;
            chartInstances.tireCost.update();
        }

        if (chartInstances.operationsSummary && payload.operations) {
            const labels = payload.operations.labels || ['Coal', 'Mining'];
            const data = payload.operations.data || [0, 0];
            chartInstances.operationsSummary.data.labels = labels;
            chartInstances.operationsSummary.data.datasets[0].data = data;
            chartInstances.operationsSummary.update();
        }

        const lastUpdated = document.getElementById('chart-last-updated');
        if (lastUpdated && payload.last_updated) {
            const updatedAt = new Date(payload.last_updated);
            lastUpdated.textContent = `Updated ${updatedAt.toLocaleString()}`;
        }
    };

    const setDefaultChartDates = () => {
        const startInput = document.getElementById('chart-start-date');
        const endInput = document.getElementById('chart-end-date');
        if (!startInput || !endInput) {
            return;
        }

        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(endDate.getDate() - 30);

        startInput.value = formatDateInputValue(startDate);
        endInput.value = formatDateInputValue(endDate);
    };

    const fetchChartData = async () => {
        const chartSection = document.querySelector('[data-chart-endpoint]');
        if (!chartSection) {
            return;
        }

        const endpoint = chartSection.dataset.chartEndpoint;
        if (!endpoint) {
            return;
        }

        const startInput = document.getElementById('chart-start-date');
        const endInput = document.getElementById('chart-end-date');

        const params = new URLSearchParams();
        if (startInput?.value) {
            params.append('start', startInput.value);
        }
        if (endInput?.value) {
            params.append('end', endInput.value);
        }

        const response = await fetch(`${endpoint}?${params.toString()}`, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        });

        if (!response.ok) {
            return;
        }

        const data = await response.json();
        updateCharts(data);
    };

    const setupChartFilters = () => {
        const startInput = document.getElementById('chart-start-date');
        const endInput = document.getElementById('chart-end-date');
        const applyButton = document.getElementById('chart-apply');
        const resetButton = document.getElementById('chart-reset');

        if (!startInput || !endInput) {
            return;
        }

        if (!startInput.value || !endInput.value) {
            setDefaultChartDates();
        }

        applyButton?.addEventListener('click', () => {
            fetchChartData();
        });

        resetButton?.addEventListener('click', () => {
            setDefaultChartDates();
            fetchChartData();
        });
    };

    const setupChartAutoRefresh = () => {
        const refreshContainer = document.querySelector('[data-chart-refresh-interval]');
        if (!refreshContainer) {
            return;
        }

        const refreshInterval = Number(refreshContainer.dataset.chartRefreshInterval || 60000);
        setInterval(() => {
            fetchChartData();
        }, refreshInterval);
    };

    const setupActivityRefresh = () => {
        const activityFeed = document.getElementById('activity-feed');
        if (!activityFeed) {
            return;
        }

        const refreshInterval = activityFeed.dataset.refreshInterval || 60000;
        setInterval(() => {
            if (typeof htmx !== 'undefined') {
                htmx.trigger(activityFeed, 'refresh');
            }
        }, refreshInterval);
    };

    const setupMobileToggle = () => {
        document.querySelectorAll('[data-mobile-toggle]').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const target = document.querySelector(toggle.dataset.mobileToggle);
                if (target) {
                    target.classList.toggle('hidden');
                }
            });
        });
    };

    const setupFormValidation = () => {
        document.querySelectorAll('form[data-validate]').forEach((form) => {
            form.addEventListener('submit', (event) => {
                const requiredFields = form.querySelectorAll('[required]');
                let isValid = true;

                requiredFields.forEach((field) => {
                    if (!field.value.trim()) {
                        field.classList.add('border-rose-500');
                        isValid = false;
                    } else {
                        field.classList.remove('border-rose-500');
                    }
                });

                if (!isValid) {
                    event.preventDefault();
                }
            });
        });
    };

    document.addEventListener('htmx:afterRequest', (event) => {
        if (event.target && event.target.hasAttribute('data-dismiss-alert') && event.detail.successful) {
            const alertCard = event.target.closest('[data-alert-card]') || event.target.closest('div');
            if (alertCard) {
                alertCard.remove();
            }
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        initializeCharts();
        setupChartFilters();
        fetchChartData();
        setupChartAutoRefresh();
        setupActivityRefresh();
        setupMobileToggle();
        setupFormValidation();
    });
</script>
