{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-black text-slate-900 mb-6">
        {% if form.instance.pk %}Edit Driver{% else %}Add New Driver{% endif %}
    </h1>
    
    <form method="post" class="bg-white p-8 rounded-2xl shadow-lg space-y-6">
        {% csrf_token %}
        
        <!-- Basic Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Name *</label>
                {{ form.name }}
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">License Number *</label>
                {{ form.license_number }}
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Phone</label>
                {{ form.phone }}
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Status *</label>
                {{ form.status }}
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Driver Type *</label>
            {{ form.driver_type }}
        </div>
        
        <div class="flex space-x-4">
            <button type="submit" 
                class="flex-1 bg-slate-900 text-white py-3 px-6 rounded-xl font-bold hover:bg-slate-800">
                Save Driver
            </button>
            <a href="{% url 'driver-list' %}" 
                class="flex-1 bg-gray-200 text-gray-700 py-3 px-6 rounded-xl font-bold hover:bg-gray-300 text-center">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
