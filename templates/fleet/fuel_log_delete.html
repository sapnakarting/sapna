{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-2xl shadow-lg">
        <h1 class="text-2xl font-black text-red-600 mb-6">Delete Fuel Entry</h1>
        
        <p class="text-gray-700 mb-6">
            Are you sure you want to delete fuel entry for <strong>{{ fuel_log.truck.plate_number }}</strong> on <strong>{{ fuel_log.date|date:"d-m-Y" }}</strong>? 
            This action cannot be undone.
        </p>
        
        <form method="post" class="flex space-x-4">
            {% csrf_token %}
            <button type="submit" 
                class="flex-1 bg-red-600 text-white py-3 px-6 rounded-xl font-bold hover:bg-red-700">
                Delete
            </button>
            <a href="{% url 'fuel-log-detail' fuel_log.id %}" 
                class="flex-1 bg-gray-200 text-gray-700 py-3 px-6 rounded-xl font-bold hover:bg-gray-300 text-center">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
