{% extends 'base.html' %}
{% block breadcrumbs %}
{% include 'components/breadcrumbs.html' with breadcrumbs=breadcrumbs %}
{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h1 class="text-3xl font-black text-slate-900">Truck Registry</h1>
            <p class="text-gray-600">Manage your fleet</p>
        </div>
        <a href="{% url 'truck-create' %}" 
            class="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-800 transition-colors">
            + Add New Truck
        </a>
    </div>
    
    <!-- Search & Filters -->
    <div class="bg-white p-6 rounded-2xl shadow-lg">
        <form method="get" 
            hx-get="{% url 'truck-search' %}" 
            hx-target="#truck-list" 
            hx-indicator="#loading"
            class="space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Search</label>
                    <input type="text" name="search" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-slate-500"
                        placeholder="Plate number or name..." value="{{ request.GET.search }}">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Fleet Type</label>
                    <select name="fleet_type" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-slate-500">
                        <option value="">All</option>
                        <option value="COAL" {% if request.GET.fleet_type == 'COAL' %}selected{% endif %}>COAL</option>
                        <option value="MINING" {% if request.GET.fleet_type == 'MINING' %}selected{% endif %}>MINING</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                    <select name="status" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-slate-500">
                        <option value="">All</option>
                        <option value="ACTIVE" {% if request.GET.status == 'ACTIVE' %}selected{% endif %}>ACTIVE</option>
                        <option value="INACTIVE" {% if request.GET.status == 'INACTIVE' %}selected{% endif %}>INACTIVE</option>
                        <option value="MAINTENANCE" {% if request.GET.status == 'MAINTENANCE' %}selected{% endif %}>MAINTENANCE</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Wheel Config</label>
                    <select name="wheel_config" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-slate-500">
                        <option value="">All</option>
                        <option value="10_WHEEL" {% if request.GET.wheel_config == '10_WHEEL' %}selected{% endif %}>10-WHEEL</option>
                        <option value="14_WHEEL" {% if request.GET.wheel_config == '14_WHEEL' %}selected{% endif %}>14-WHEEL</option>
                        <option value="16_WHEEL" {% if request.GET.wheel_config == '16_WHEEL' %}selected{% endif %}>16-WHEEL</option>
                    </select>
                </div>
            </div>
            
            <div id="loading" class="hidden">
                <div class="flex items-center space-x-2 text-slate-600">
                    <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Loading...</span>
                </div>
            </div>
        </form>
    </div>
    
    <!-- Truck List -->
    <div id="truck-list" class="bg-white rounded-2xl shadow-lg overflow-hidden">
        {% include 'fleet/truck_list_partial.html' %}
    </div>
</div>
{% endblock %}
