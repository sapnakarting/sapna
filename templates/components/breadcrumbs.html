{% if breadcrumbs %}
<nav class="flex items-center space-x-2 text-sm mb-6" aria-label="Breadcrumb">
    <!-- Home Icon -->
    <a href="{% url 'dashboard:index' %}"
       class="flex items-center gap-1 text-slate-500 hover:text-amber-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span>Home</span>
    </a>

    {% for crumb in breadcrumbs %}
    <!-- Separator -->
    <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
    </svg>

    {% if crumb.url %}
    <!-- Clickable Breadcrumb -->
    <a href="{{ crumb.url }}"
       class="text-slate-500 hover:text-amber-600 transition-colors">
        {{ crumb.name }}
    </a>
    {% else %}
    <!-- Current Page (Not Clickable) -->
    <span class="text-slate-900 font-semibold">{{ crumb.name }}</span>
    {% endif %}
    {% endfor %}
</nav>
{% endif %}
