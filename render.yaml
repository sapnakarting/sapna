services:
  - type: web
    name: sapna-carting
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn sapna_carting.wsgi --log-file -"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sapna-carting-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /health/
    autoDeploy: true
    plan: starter
    branch: main

  - type: cron
    name: backup-cron
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py backup_database --compress"
    schedule: "0 2 * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sapna-carting-db
          property: connectionString
    plan: starter

databases:
  - name: sapna-carting-db
    databaseName: sapna_carting
    user: sapna_carting
    plan: starter
    ipAllowList: []
